aid: gauntlet
name: Gauntlet
description: >-
  Gauntlet (Gauntlet Networks, Inc.) is a crypto risk-management and yield-curation
  firm that runs agent-based economic simulations to optimize risk, incentives, and
  capital efficiency for DeFi protocols, and curates 80+ institutional-grade yield
  vaults across Aera, Morpho, Kamino, Drift, and Symbiotic. For developers it ships
  the Gauntlet Developer Kit: a public read-only REST API at api.gauntlet.xyz (v1)
  exposing vault metrics, user positions with PnL, wallet activity, TVL, and token
  prices, plus an official TypeScript SDK (@gauntlet-xyz/sdk) for on-chain deposits,
  withdrawals, and ERC-8021 attribution. Authentication is a partner-provisioned
  Bearer API key. Backed by Paradigm, Polychain, and Ribbit Capital.
