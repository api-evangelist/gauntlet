specification: API Commons Rate Limits
specificationVersion: '0.1'
provider: Gauntlet
providerId: gauntlet
generated: '2026-07-19'
method: searched
created: '2026-07-19'
modified: '2026-07-19'
tags:
  - Rate Limiting
  - DeFi
description: >-
  Gauntlet API rate limits are enforced per API key. Requests are capped at 60 per
  minute and 10,000 per day; exceeding a limit returns HTTP 429. Standard rate-limit
  headers are returned on every response so clients can back off until reset.
source: https://docs.gauntlet.xyz/onboarding/credentials
headers:
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  reset: X-RateLimit-Reset
responseCodes:
  throttled: 429
limits:
  - name: Per-minute requests
    scope: api_key
    metric: requests_per_minute
    limit: 60
    timeFrame: minute
  - name: Per-day requests
    scope: api_key
    metric: requests_per_day
    limit: 10000
    timeFrame: day
guidance: On 429, back off until the time indicated by X-RateLimit-Reset before retrying.
